<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque de Peças</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg-void:#0B0E13;
  --surface:#1B222C;
  --surface-alt:#232C38;
  --surface-raised:#2A3441;
  --border:#313B49;
  --copper:#C4834E;
  --copper-bright:#E0A468;
  --solder:#4FA187;
  --solder-bright:#6BC7A6;
  --text:#EDEAE3;
  --text-muted:#8B93A1;
  --text-dim:#5C6473;
  --danger:#D9645E;
  --danger-bright:#E88883;
  --warning:#E0A83C;
  --radius-lg:28px;
  --radius-md:16px;
  --radius-sm:10px;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(circle at 20% -10%, #1a2230 0%, transparent 45%),
    radial-gradient(circle at 90% 10%, #1a2836 0%, transparent 40%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 24px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 24px),
    var(--bg-void);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:18px 10px;
}

.phone-frame{
  width:100%;
  max-width:412px;
  background:var(--bg-void);
  border:7px solid #050709;
  border-radius:40px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.03) inset;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-height:calc(100vh - 36px);
  position:relative;
}

/* status bar */
.status-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 22px 4px;
  font-family:var(--font-display);
  font-size:11px;
  letter-spacing:0.12em;
  color:var(--text-dim);
  flex-shrink:0;
}
.status-bar .brand-mark{ color:var(--copper-bright); font-weight:600; }
.status-battery{ display:flex; align-items:center; gap:6px; }
.status-battery .pct{ font-size:11px; color:var(--text-muted); font-family:var(--font-body); font-weight:600; }
.batt-icon{ display:flex; align-items:center; }
.batt-shell{ width:22px; height:11px; border:1.4px solid var(--text-dim); border-radius:3px; position:relative; padding:1.5px; }
.batt-shell::after{ content:''; position:absolute; right:-4px; top:3px; width:2.5px; height:5px; background:var(--text-dim); border-radius:0 2px 2px 0; }
.batt-fill{ height:100%; border-radius:1px; }

.notch{
  position:absolute;
  top:0; left:50%; transform:translateX(-50%);
  width:120px; height:22px;
  background:#050709;
  border-radius:0 0 16px 16px;
  z-index:5;
}

/* header */
.app-header{
  padding:6px 22px 16px;
  flex-shrink:0;
}
.app-header .eyebrow{
  font-family:var(--font-display);
  font-size:11px;
  letter-spacing:0.18em;
  color:var(--solder-bright);
  margin:0 0 4px;
  font-weight:600;
}
.app-header h1{
  font-family:var(--font-display);
  font-size:26px;
  font-weight:700;
  margin:0;
  letter-spacing:-0.01em;
}

/* main scroll area */
#main-content{
  flex:1;
  overflow-y:auto;
  padding:0 20px 100px;
  scrollbar-width:none;
}
#main-content::-webkit-scrollbar{ display:none; }

/* bottom nav */
.bottom-nav{
  position:absolute;
  bottom:0; left:0; right:0;
  background:rgba(27,34,44,0.88);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:10px 24px 8px;
  z-index:10;
}
.nav-btn{
  background:none; border:none; color:var(--text-dim);
  font-family:var(--font-display); font-size:11px; letter-spacing:0.06em;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:6px 14px; cursor:pointer; font-weight:600;
}
.nav-btn.active{ color:var(--copper-bright); }
.nav-btn svg{ width:20px; height:20px; }
.fab{
  width:52px; height:52px; border-radius:50%;
  background:linear-gradient(145deg, var(--copper-bright), var(--copper));
  border:none; color:#1B120A; font-size:26px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; margin-top:-30px;
  box-shadow:0 8px 20px -6px rgba(196,131,78,0.6), 0 0 0 6px var(--bg-void);
}
.home-indicator{
  width:120px; height:4px; background:var(--text-dim); border-radius:3px;
  margin:6px auto 0; opacity:0.5;
}

/* stat cards */
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:8px 0 18px; }
.stat-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:14px 16px;
}
.stat-card.full{ grid-column:1/-1; background:linear-gradient(135deg, var(--surface-alt), var(--surface)); }
.stat-card .label{ font-size:11px; color:var(--text-muted); letter-spacing:0.04em; margin:0 0 6px; }
.stat-card .value{ font-family:var(--font-display); font-size:22px; font-weight:700; margin:0; }
.stat-card .value.copper{ color:var(--copper-bright); }
.stat-card .value.solder{ color:var(--solder-bright); }

.section-title{
  font-family:var(--font-display); font-size:13px; letter-spacing:0.08em;
  color:var(--text-muted); margin:22px 0 10px; display:flex; align-items:center; justify-content:space-between;
  text-transform:uppercase;
}
.section-title .count-badge{
  background:var(--surface-alt); color:var(--text); padding:2px 9px; border-radius:20px; font-size:11px; letter-spacing:0;
}
.section-header-row{ display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px; gap:10px; }
.section-title-text{
  font-family:var(--font-display); font-size:13px; letter-spacing:0.08em;
  color:var(--text-muted); text-transform:uppercase; display:flex; align-items:center; gap:8px;
}
.pdf-btn{
  background:var(--surface-alt); border:1px solid var(--copper); color:var(--copper-bright);
  font-size:11px; font-weight:700; padding:6px 12px; border-radius:20px; cursor:pointer;
  font-family:var(--font-body); display:flex; align-items:center; gap:5px; flex-shrink:0; white-space:nowrap;
}
.pdf-btn svg{ width:12px; height:12px; }
.pdf-banner{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid rgba(224,168,60,0.35);
  border-left:3px solid var(--warning); border-radius:var(--radius-sm); padding:10px 13px; margin-bottom:10px;
  font-size:12px; color:var(--text-muted); cursor:pointer;
}
.pdf-banner strong{ color:var(--text); }
.pdf-banner .pdf-banner-link{ color:var(--copper-bright); font-weight:700; text-decoration:underline; }

/* low stock rows */
.low-stock-row{
  display:flex; align-items:center; gap:12px;
  background:var(--surface); border:1px solid rgba(217,100,94,0.25); border-radius:var(--radius-sm);
  padding:11px 12px; margin-bottom:8px; cursor:pointer;
}
.low-stock-row .dot{ width:8px; height:8px; border-radius:50%; background:var(--danger); flex-shrink:0; }
.low-stock-row .info{ flex:1; min-width:0; }
.low-stock-row .name{ font-size:13.5px; font-weight:600; margin:0 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.low-stock-row .sub{ font-size:11.5px; color:var(--text-muted); margin:0; }
.low-stock-row .qty-tag{ font-family:var(--font-display); font-size:12px; color:var(--danger-bright); font-weight:700; flex-shrink:0; }
.restock-btn{
  background:var(--surface-alt); border:1px solid var(--border); color:var(--solder-bright);
  width:28px; height:28px; border-radius:8px; font-size:16px; font-weight:700; cursor:pointer; flex-shrink:0;
}

/* category breakdown */
.cat-bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
.cat-bar-row .cat-icon-sm{ width:26px; height:26px; border-radius:8px; background:var(--surface-alt); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--copper-bright); }
.cat-bar-row .cat-icon-sm svg{ width:14px; height:14px; }
.cat-bar-row .bar-track{ flex:1; height:8px; background:var(--surface); border-radius:6px; overflow:hidden; }
.cat-bar-row .bar-fill{ height:100%; border-radius:6px; background:linear-gradient(90deg, var(--solder), var(--solder-bright)); }
.cat-bar-row .bar-count{ font-size:11.5px; color:var(--text-muted); width:18px; text-align:right; flex-shrink:0; }

/* empty state */
.empty-state{ text-align:center; padding:60px 20px 20px; color:var(--text-muted); }
.empty-state .icon{ font-size:38px; margin-bottom:10px; }
.empty-state h3{ font-family:var(--font-display); color:var(--text); font-size:16px; margin:0 0 6px; }
.empty-state p{ font-size:13px; margin:0; line-height:1.5; }

/* search + filters */
.search-wrap{ position:relative; margin:8px 0 12px; }
.search-wrap input{
  width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:11px 14px 11px 38px; color:var(--text); font-size:14px; font-family:var(--font-body);
}
.search-wrap input::placeholder{ color:var(--text-dim); }
.search-wrap input:focus{ outline:none; border-color:var(--copper); }
.search-wrap .search-icon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-dim); width:16px; height:16px; }

.chip-row{ display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:6px; scrollbar-width:none; }
.chip-row::-webkit-scrollbar{ display:none; }
.chip{
  flex-shrink:0; background:var(--surface); border:1px solid var(--border); color:var(--text-muted);
  padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.chip.active{ background:var(--copper); border-color:var(--copper); color:#1B120A; }

.brand-select-wrap{ margin-bottom:14px; }
select.filter-select{
  width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
  padding:10px 14px; border-radius:var(--radius-sm); font-size:13px; font-family:var(--font-body);
}

/* item cards */
.item-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:13px 14px; margin-bottom:10px; display:flex; gap:12px; cursor:pointer; align-items:flex-start;
  transition:background 0.15s, border-color 0.15s;
}
.item-card.tier-good{ background:var(--surface); border-color:var(--border); }

/* estoque baixo: cartão inteiro vermelho, texto claro pra contraste */
.item-card.tier-low{ background:var(--danger); border-color:var(--danger); }
.item-card.tier-low .item-name{ color:#fff; }
.item-card.tier-low .item-meta{ color:rgba(255,255,255,0.85); }
.item-card.tier-low .item-brand-tag{ color:#fff; }
.item-card.tier-low .item-price{ color:#fff; }
.item-card.tier-low .item-price .label{ color:rgba(255,255,255,0.75); }
.item-card.tier-low .gauge-label{ color:rgba(255,255,255,0.85); }
.item-card.tier-low .item-icon{ background:rgba(255,255,255,0.18); color:#fff; }
.item-card.tier-low .gauge-track{ background:rgba(0,0,0,0.28); }
.item-card.tier-low .gauge-fill{ background:#fff !important; }

/* estoque médio: cartão inteiro laranja/amarelo, texto escuro pra contraste */
.item-card.tier-medium{ background:var(--warning); border-color:var(--warning); }
.item-card.tier-medium .item-name{ color:#241B0B; }
.item-card.tier-medium .item-meta{ color:rgba(36,27,11,0.8); }
.item-card.tier-medium .item-brand-tag{ color:#241B0B; }
.item-card.tier-medium .item-price{ color:#241B0B; }
.item-card.tier-medium .item-price .label{ color:rgba(36,27,11,0.65); }
.item-card.tier-medium .gauge-label{ color:rgba(36,27,11,0.75); }
.item-card.tier-medium .item-icon{ background:rgba(0,0,0,0.14); color:#241B0B; }
.item-card.tier-medium .gauge-track{ background:rgba(0,0,0,0.18); }
.item-card.tier-medium .gauge-fill{ background:#241B0B !important; }
.item-icon{
  width:40px; height:40px; border-radius:12px; background:var(--surface-alt);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--copper-bright);
}
.item-icon svg{ width:20px; height:20px; }
.item-body{ flex:1; min-width:0; }
.item-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.item-name{ font-size:14.5px; font-weight:700; margin:0 0 2px; }
.item-meta{ font-size:11.5px; color:var(--text-muted); margin:0 0 8px; }
.item-brand-tag{ color:var(--solder-bright); font-weight:600; }
.item-price{ font-family:var(--font-display); font-size:14px; font-weight:700; color:var(--copper-bright); white-space:nowrap; }
.item-price .label{ display:block; font-family:var(--font-body); font-size:9.5px; color:var(--text-dim); font-weight:400; text-align:right; }

.gauge-row{ display:flex; align-items:center; gap:8px; }
.gauge-track{ flex:1; height:6px; background:var(--surface-raised); border-radius:6px; overflow:hidden; }
.gauge-fill{ height:100%; border-radius:6px; }
.gauge-fill.ok{ background:linear-gradient(90deg, var(--solder), var(--solder-bright)); }
.gauge-fill.warn{ background:linear-gradient(90deg, #b98330, var(--warning)); }
.gauge-fill.crit{ background:linear-gradient(90deg, #a4453f, var(--danger)); }
.gauge-label{ font-size:11px; color:var(--text-muted); flex-shrink:0; min-width:50px; text-align:right; }
.qty-controls{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
.qty-btn{
  width:24px; height:24px; border-radius:7px; border:1px solid var(--border); background:var(--surface-alt);
  color:var(--text); font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;
}

/* form */
.form-group{ margin-bottom:16px; }
.form-group label{ display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px; font-weight:600; letter-spacing:0.02em; }
.form-group input, .form-group select, .form-group textarea{
  width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:11px 13px; color:var(--text); font-size:14px; font-family:var(--font-body);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{ outline:none; border-color:var(--copper); }
.form-group textarea{ resize:vertical; min-height:60px; }
.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-back{
  display:flex; align-items:center; gap:8px; background:none; border:none; color:var(--text-muted);
  font-family:var(--font-body); font-size:13px; padding:12px 0 4px; cursor:pointer; font-weight:600;
}
.form-title{ font-family:var(--font-display); font-size:20px; font-weight:700; margin:0 0 20px; }
.btn-primary{
  width:100%; background:linear-gradient(135deg, var(--copper-bright), var(--copper)); border:none;
  color:#1B120A; padding:13px; border-radius:var(--radius-sm); font-size:14.5px; font-weight:700; cursor:pointer;
  font-family:var(--font-display); letter-spacing:0.02em; margin-top:4px;
}
.btn-danger-outline{
  width:100%; background:none; border:1px solid rgba(217,100,94,0.4); color:var(--danger-bright);
  padding:12px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:600; cursor:pointer; margin-top:10px;
}
.field-error{ color:var(--danger-bright); font-size:12px; margin:10px 0 0; text-align:center; }

/* detail view */
.detail-header{ display:flex; align-items:center; gap:12px; margin:6px 0 18px; }
.detail-icon{ width:48px; height:48px; border-radius:14px; background:var(--surface-alt); display:flex; align-items:center; justify-content:center; color:var(--copper-bright); flex-shrink:0; }
.detail-icon svg{ width:24px; height:24px; }
.detail-header h2{ font-family:var(--font-display); font-size:19px; margin:0 0 3px; }
.detail-header .sub{ font-size:12.5px; color:var(--text-muted); }
.detail-stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
.detail-stat{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:13px; }
.detail-stat .label{ font-size:11px; color:var(--text-muted); margin:0 0 4px; }
.detail-stat .value{ font-family:var(--font-display); font-size:17px; font-weight:700; }
.detail-qty-box{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; margin-bottom:18px; text-align:center; }
.detail-qty-box .qty-big{ font-family:var(--font-display); font-size:32px; font-weight:700; margin:6px 0; }
.detail-qty-controls{ display:flex; align-items:center; justify-content:center; gap:18px; margin-top:8px; }
.qty-btn-lg{ width:42px; height:42px; border-radius:12px; border:1px solid var(--border); background:var(--surface-alt); color:var(--text); font-size:20px; font-weight:700; cursor:pointer; }
.detail-notes{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:16px; font-size:13px; color:var(--text-muted); line-height:1.6; }
.edit-btn{ background:var(--surface-alt); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; cursor:pointer; }

/* modal / overlay */
.overlay{
  position:absolute; inset:0; background:rgba(5,7,9,0.72); backdrop-filter:blur(3px);
  display:flex; align-items:flex-end; justify-content:center; z-index:50;
}
.overlay.hidden{ display:none; }
.confirm-sheet{
  background:var(--surface-alt); border-top:1px solid var(--border); border-radius:24px 24px 0 0;
  width:100%; padding:24px 22px 30px; text-align:center;
}
.confirm-sheet h3{ font-family:var(--font-display); font-size:17px; margin:0 0 8px; }
.confirm-sheet p{ font-size:13px; color:var(--text-muted); margin:0 0 20px; line-height:1.5; }
.confirm-actions{ display:flex; gap:10px; }
.confirm-actions button{ flex:1; padding:12px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:700; cursor:pointer; border:none; }
.confirm-cancel{ background:var(--surface); color:var(--text); border:1px solid var(--border) !important; }
.confirm-delete{ background:var(--danger); color:#fff; }

.toast{
  position:absolute; bottom:96px; left:50%; transform:translateX(-50%);
  background:var(--surface-raised); border:1px solid var(--border); color:var(--text);
  padding:10px 18px; border-radius:20px; font-size:12.5px; z-index:60; white-space:nowrap;
  box-shadow:0 8px 20px rgba(0,0,0,0.4);
}
.loading-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:100px 20px; color:var(--text-muted); font-size:13px; gap:12px; }
.spinner{ width:26px; height:26px; border:2.5px solid var(--border); border-top-color:var(--copper-bright); border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="notch"></div>
  <div class="status-bar">
    <span class="brand-mark">PARTS·OS</span>
    <div class="status-battery">
      <span class="pct" id="status-pct">--</span>
      <div class="batt-icon"><div class="batt-shell"><div class="batt-fill" id="status-batt-fill" style="width:0%"></div></div></div>
    </div>
  </div>

  <header class="app-header">
    <p class="eyebrow">CONTROLE DE ESTOQUE</p>
    <h1 id="header-title">Peças & Componentes</h1>
  </header>

  <main id="main-content"><div class="loading-wrap"><div class="spinner"></div>Carregando estoque…</div></main>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn" data-view="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="0.5" fill="currentColor"/></svg>
      Painel
    </button>
    <button class="fab" id="fab-add">+</button>
    <button class="nav-btn" data-view="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="14" width="8" height="7" rx="2"/></svg>
      Estoque
    </button>
  </nav>

  <div class="overlay hidden" id="confirm-overlay">
    <div class="confirm-sheet">
      <h3>Excluir peça?</h3>
      <p id="confirm-text">Essa ação não pode ser desfeita.</p>
      <div class="confirm-actions">
        <button class="confirm-cancel" id="confirm-cancel-btn">Cancelar</button>
        <button class="confirm-delete" id="confirm-delete-btn">Excluir</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="report-overlay">
    <div class="confirm-sheet" style="text-align:left">
      <h3 style="text-align:center">Relatório de estoque</h3>
      <p style="text-align:center">Escolha uma marca pra conferência/inspeção, ou gere com todas. O relatório traz todas as peças, com status e sugestão de compra pras que precisam.</p>
      <div class="chip-row" id="report-chip-row" style="margin:14px 0 4px; overflow-x:auto;"></div>
      <div class="confirm-actions" style="margin-top:16px;">
        <button class="confirm-cancel" id="report-cancel-btn">Cancelar</button>
        <button class="confirm-delete" id="report-generate-btn" style="background:linear-gradient(135deg, var(--copper-bright), var(--copper)); color:#1B120A;">Gerar PDF</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
(function(){
  "use strict";

  var CATEGORIES = ["Tela","Bateria","Conector de Carga","Câmera","Alto-falante","Flex","Carcaça","Outro"];
  var BRANDS = ["Samsung","Xiaomi","Motorola","Apple","LG","Realme","Outro"];
  var STORAGE_KEY = "inventory-items";

  var state = {
    view: "list",
    items: [],
    loading: true,
    error: null,
    search: "",
    filterCategory: "all",
    editingId: null,
    pendingDeleteId: null,
    reportFilterBrand: "all"
  };

  var mainEl = document.getElementById("main-content");
  var navEl = document.getElementById("bottom-nav");

  // ---------- storage (localStorage: salva localmente no navegador/dispositivo) ----------
  function loadItems(){
    return new Promise(function(resolve){
      try{
        var raw = localStorage.getItem(STORAGE_KEY);
        resolve(raw ? JSON.parse(raw) : []);
      }catch(e){
        resolve([]);
      }
    });
  }

  function saveItems(){
    return new Promise(function(resolve){
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items));
        resolve(true);
      }catch(e){
        showToast("Não foi possível salvar. Verifique o espaço do navegador.");
        resolve(false);
      }
    });
  }

  // ---------- helpers ----------
  function fmtBRL(n){
    n = Number(n) || 0;
    return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
  }
  function uid(){ return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function isLow(item){ return item.quantity <= item.minStock; }
  // Nível de estoque relativo ao mínimo de CADA peça — assim uma peça que "gira" pouco
  // (mínimo baixo) pode estar verde com poucas unidades, e uma que gira muito (mínimo alto)
  // já fica amarela/vermelha com mais unidades.
  function stockTier(item){
    if(item.quantity <= item.minStock) return 'low';
    if(item.minStock > 0 && item.quantity <= item.minStock * 2) return 'medium';
    if(item.minStock === 0 && item.quantity <= 2) return 'medium';
    return 'good';
  }
  function tierToGaugeClass(tier){
    return tier === 'low' ? 'crit' : (tier === 'medium' ? 'warn' : 'ok');
  }

  function catIcon(cat){
    var icons = {
      "Tela": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="2" width="14" height="20" rx="2.5"/><line x1="10" y1="19" x2="14" y2="19"/></svg>',
      "Bateria": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M19 10v4" stroke-width="2.2"/><rect x="5" y="9.5" width="9" height="5" rx="1" fill="currentColor" stroke="none" opacity="0.5"/></svg>',
      "Conector de Carga": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="8" width="16" height="9" rx="3"/><line x1="9" y1="4" x2="9" y2="8"/><line x1="15" y1="4" x2="15" y2="8"/></svg>',
      "Câmera": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="4"/><path d="M8 6l1.5-2h5L16 6"/></svg>',
      "Alto-falante": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.8" fill="currentColor"/></svg>',
      "Flex": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6c4 0 2 6 6 6s2 6 6 6c2 0 3-1 4-2"/><circle cx="4" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="20" cy="16" r="1.4" fill="currentColor" stroke="none"/></svg>',
      "Carcaça": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="4"/><line x1="9" y1="7" x2="15" y2="7"/></svg>',
      "Outro": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="12" r="2.2"/><circle cx="12" cy="6" r="2.2"/><circle cx="18" cy="12" r="2.2"/><circle cx="12" cy="18" r="2.2"/><line x1="7.8" y1="10.5" x2="10.3" y2="7.5"/><line x1="13.8" y1="7.5" x2="16.2" y2="10.5"/><line x1="16.2" y1="13.5" x2="13.8" y2="16.5"/><line x1="10.3" y1="16.5" x2="7.8" y2="13.5"/></svg>'
    };
    return icons[cat] || icons["Outro"];
  }

  function showToast(msg){
    var existing = document.querySelector(".toast");
    if(existing) existing.remove();
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.querySelector(".phone-frame").appendChild(t);
    setTimeout(function(){ t.remove(); }, 2200);
  }

  function updateStatusBar(){
    var items = state.items;
    var lowCount = items.filter(isLow).length;
    var pct = items.length ? Math.round(((items.length - lowCount) / items.length) * 100) : 100;
    document.getElementById("status-pct").textContent = pct + "%";
    var fill = document.getElementById("status-batt-fill");
    fill.style.width = pct + "%";
    fill.style.background = pct > 60 ? "var(--solder-bright)" : (pct > 30 ? "var(--warning)" : "var(--danger)");
  }

  function setActiveNav(){
    var btns = navEl.querySelectorAll(".nav-btn");
    for(var i=0;i<btns.length;i++){
      btns[i].classList.toggle("active", btns[i].getAttribute("data-view") === state.view);
    }
    var titles = { dashboard: "Resumo do Estoque", list: "Peças & Componentes", form: state.editingId ? "Editar Peça" : "Nova Peça", detail: "Detalhes da Peça" };
    document.getElementById("header-title").textContent = titles[state.view] || "Peças & Componentes";
  }

  // ---------- render dispatch ----------
  function render(){
    setActiveNav();
    updateStatusBar();
    if(state.view === "dashboard") renderDashboard();
    else if(state.view === "list") renderList();
    else if(state.view === "form") renderForm();
    else if(state.view === "detail") renderDetail();
  }

  // ---------- dashboard ----------
  function renderDashboard(){
    var items = state.items;
    if(items.length === 0){
      mainEl.innerHTML =
        '<div class="empty-state">' +
          '<div class="icon">🔧</div>' +
          '<h3>Nenhuma peça cadastrada</h3>' +
          '<p>Toque no botão + para adicionar sua primeira peça ao estoque.</p>' +
        '</div>';
      return;
    }
    var totalUnits = items.reduce(function(s,i){ return s + i.quantity; }, 0);
    var totalInvested = items.reduce(function(s,i){ return s + i.quantity * i.costPrice; }, 0);
    var potentialSale = items.reduce(function(s,i){ return s + i.quantity * i.salePrice; }, 0);
    var lowStock = items.filter(isLow).sort(function(a,b){ return (a.quantity - a.minStock) - (b.quantity - b.minStock); });

    var catCounts = {};
    CATEGORIES.forEach(function(c){ catCounts[c] = 0; });
    items.forEach(function(i){ catCounts[i.category] = (catCounts[i.category]||0) + 1; });
    var maxCat = Math.max.apply(null, Object.values(catCounts).concat([1]));

    var html = '';
    html += '<div class="stat-grid">';
    html += '<div class="stat-card"><p class="label">Peças cadastradas</p><p class="value">' + items.length + '</p></div>';
    html += '<div class="stat-card"><p class="label">Unidades em estoque</p><p class="value solder">' + totalUnits + '</p></div>';
    html += '<div class="stat-card full"><p class="label">Valor investido (custo)</p><p class="value copper">' + fmtBRL(totalInvested) + '</p></div>';
    html += '<div class="stat-card full"><p class="label">Valor de venda total (se vender tudo)</p><p class="value">' + fmtBRL(potentialSale) + '</p></div>';
    html += '</div>';

    html += '<div class="section-header-row"><span class="section-title-text">Estoque baixo <span class="count-badge">' + lowStock.length + '</span></span>' +
      '<button class="pdf-btn" id="pdf-report-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Relatório PDF</button>' +
    '</div>';
    if(lowStock.length === 0){
      html += '<p style="font-size:12.5px;color:var(--text-muted);margin:0 0 10px;">Tudo certo por aqui — nenhuma peça abaixo do mínimo.</p>';
    } else {
      lowStock.slice(0,6).forEach(function(item){
        html += '<div class="low-stock-row" data-open="' + item.id + '">' +
          '<span class="dot"></span>' +
          '<div class="info"><p class="name">' + esc(item.name) + '</p><p class="sub">' + esc(item.brand) + (item.model ? ' · ' + esc(item.model) : '') + '</p></div>' +
          '<span class="qty-tag">' + item.quantity + '/' + item.minStock + '</span>' +
        '</div>';
      });
    }

    html += '<div class="section-title">Peças por categoria</div>';
    CATEGORIES.forEach(function(c){
      if(catCounts[c] === 0) return;
      var w = Math.max(6, Math.round((catCounts[c]/maxCat)*100));
      html += '<div class="cat-bar-row">' +
        '<div class="cat-icon-sm">' + catIcon(c) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + w + '%"></div></div>' +
        '<span class="bar-count">' + catCounts[c] + '</span>' +
      '</div>';
    });

    mainEl.innerHTML = html;

    mainEl.querySelectorAll('[data-open]').forEach(function(el){
      el.addEventListener('click', function(){ openDetail(el.getAttribute('data-open')); });
    });
    var pdfBtn = document.getElementById("pdf-report-btn");
    if(pdfBtn) pdfBtn.addEventListener("click", function(e){ e.stopPropagation(); openReportFilter(); });
  }

  // ---------- list ----------
  function matchesFilters(item){
    var s = state.search.trim().toLowerCase();
    if(s){
      var hay = (item.name + " " + item.brand + " " + item.model).toLowerCase();
      if(hay.indexOf(s) === -1) return false;
    }
    if(state.filterCategory !== "all" && item.category !== state.filterCategory) return false;
    return true;
  }

  function renderList(){
    var lowCount = state.items.filter(isLow).length;
    var html = '';
    if(lowCount > 0){
      html += '<div class="pdf-banner" id="pdf-banner-list">⚠️ <strong>' + lowCount + ' peça(s)</strong> abaixo do mínimo — <span class="pdf-banner-link">gerar relatório PDF</span></div>';
    }
    html += '<div class="search-wrap">' +
      '<svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
      '<input type="text" id="search-input" placeholder="Buscar por nome, marca ou modelo..." value="' + esc(state.search) + '">' +
    '</div>';
    html += '<div class="chip-row" id="chip-row">';
    html += '<button class="chip' + (state.filterCategory==="all"?" active":"") + '" data-cat="all">Todas</button>';
    CATEGORIES.forEach(function(c){
      html += '<button class="chip' + (state.filterCategory===c?" active":"") + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
    });
    html += '</div>';
    html += '<div id="items-container"></div>';
    mainEl.innerHTML = html;

    var pdfBannerList = document.getElementById("pdf-banner-list");
    if(pdfBannerList) pdfBannerList.addEventListener("click", openReportFilter);

    var searchInput = document.getElementById("search-input");
    searchInput.addEventListener("input", function(){
      state.search = searchInput.value;
      renderItemsContainer();
    });

    mainEl.querySelectorAll('#chip-row .chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        state.filterCategory = chip.getAttribute('data-cat');
        mainEl.querySelectorAll('#chip-row .chip').forEach(function(c2){
          c2.classList.toggle('active', c2 === chip);
        });
        renderItemsContainer();
      });
    });

    renderItemsContainer();
  }

  function renderItemsContainer(){
    var container = document.getElementById("items-container");
    if(!container) return;
    var filtered = state.items.filter(matchesFilters).sort(function(a,b){ return a.name.localeCompare(b.name); });

    if(state.items.length === 0){
      container.innerHTML = '<div class="empty-state"><div class="icon">📦</div><h3>Estoque vazio</h3><p>Adicione peças usando o botão + abaixo.</p></div>';
      return;
    }
    if(filtered.length === 0){
      container.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><h3>Nada encontrado</h3><p>Tente outro termo de busca ou categoria.</p></div>';
      return;
    }

    var html = '';
    filtered.forEach(function(item){
      var low = isLow(item);
      var tier = stockTier(item);
      var gaugeClass = tierToGaugeClass(tier);
      var ratio = item.minStock > 0 ? item.quantity / (item.minStock * 2) : (item.quantity > 0 ? Math.min(1, item.quantity / 4) : 0);
      ratio = Math.max(0, Math.min(1, ratio));
      html += '<div class="item-card tier-' + tier + '" data-open="' + item.id + '">' +
        '<div class="item-icon">' + catIcon(item.category) + '</div>' +
        '<div class="item-body">' +
          '<div class="item-top">' +
            '<div><p class="item-name">' + esc(item.name) + '</p><p class="item-meta"><span class="item-brand-tag">' + esc(item.brand) + '</span>' + (item.model ? ' · ' + esc(item.model) : '') + '</p></div>' +
            '<div class="item-price">' + fmtBRL(item.salePrice) + '<span class="label">venda</span></div>' +
          '</div>' +
          '<div class="gauge-row">' +
            '<div class="gauge-track"><div class="gauge-fill ' + gaugeClass + '" style="width:' + Math.round(ratio*100) + '%"></div></div>' +
            '<span class="gauge-label">' + item.quantity + ' un.</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    });
    container.innerHTML = html;

    container.querySelectorAll('[data-open]').forEach(function(el){
      el.addEventListener('click', function(){
        openDetail(el.getAttribute('data-open'));
      });
    });
  }

  function adjustQty(id, delta){
    var item = state.items.find(function(i){ return i.id === id; });
    if(!item) return;
    item.quantity = Math.max(0, item.quantity + delta);
    saveItems();
    updateStatusBar();
  }

  // ---------- relatório de estoque / reposição (PDF) ----------
  function openReportFilter(){
    if(state.items.length === 0){
      showToast("Nenhuma peça cadastrada ainda.");
      return;
    }
    var brands = [];
    state.items.forEach(function(i){ if(brands.indexOf(i.brand) === -1) brands.push(i.brand); });
    brands.sort();

    state.reportFilterBrand = "all";
    var chipRow = document.getElementById("report-chip-row");
    var html = '<button class="chip active" data-brand-filter="all">Todas as marcas</button>';
    brands.forEach(function(b){
      html += '<button class="chip" data-brand-filter="' + esc(b) + '">' + esc(b) + '</button>';
    });
    chipRow.innerHTML = html;

    chipRow.querySelectorAll('.chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        state.reportFilterBrand = chip.getAttribute('data-brand-filter');
        chipRow.querySelectorAll('.chip').forEach(function(c2){ c2.classList.toggle('active', c2 === chip); });
      });
    });

    document.getElementById("report-overlay").classList.remove("hidden");
  }

  function suggestedQtyFor(item, tier){
    if(tier === 'good') return 0;
    return Math.max(1, (item.minStock * 2) - item.quantity);
  }

  function generateRestockPDF(brandFilter){
    brandFilter = brandFilter || "all";
    var items = state.items.slice();
    if(brandFilter !== "all"){
      items = items.filter(function(i){ return i.brand === brandFilter; });
    }
    if(items.length === 0){
      showToast(brandFilter === "all" ? "Nenhuma peça cadastrada ainda." : "Nenhuma peça da marca " + brandFilter + " cadastrada.");
      return;
    }
    if(!window.jspdf || !window.jspdf.jsPDF){
      showToast("Não foi possível carregar o gerador de PDF. Verifique sua conexão.");
      return;
    }

    var jsPDFCtor = window.jspdf.jsPDF;
    var doc = new jsPDFCtor();
    var now = new Date();
    var dateStr = now.toLocaleDateString('pt-BR') + ' às ' + now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    var titleSuffix = brandFilter !== "all" ? ' — ' + brandFilter : '';

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.setTextColor(30, 30, 30);
    doc.text('Relatório de Estoque' + titleSuffix, 14, 18);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9.5);
    doc.setTextColor(110, 110, 110);
    doc.text('Gerado em ' + dateStr + (brandFilter !== "all" ? ' · Marca: ' + brandFilter : ' · Todas as marcas') + ' · Use para conferência física e para compras', 14, 25);

    var tierOrder = { low: 0, medium: 1, good: 2 };
    var sorted = items.slice().sort(function(a, b){
      var ta = stockTier(a), tb = stockTier(b);
      if(tierOrder[ta] !== tierOrder[tb]) return tierOrder[ta] - tierOrder[tb];
      return a.name.localeCompare(b.name);
    });

    var rows = [];
    var totalCost = 0;
    var totalUnits = 0;
    var lowCount = 0, mediumCount = 0, goodCount = 0;
    var statusLabel = { low: 'Baixo', medium: 'Médio', good: 'Bom' };

    sorted.forEach(function(item){
      var tier = stockTier(item);
      if(tier === 'low') lowCount++; else if(tier === 'medium') mediumCount++; else goodCount++;
      var suggested = suggestedQtyFor(item, tier);
      var cost = suggested * item.costPrice;
      totalCost += cost;
      totalUnits += suggested;
      rows.push([
        item.name,
        item.category,
        item.brand + (item.model ? ' - ' + item.model : ''),
        String(item.quantity),
        String(item.minStock),
        statusLabel[tier],
        suggested > 0 ? String(suggested) : '—',
        suggested > 0 ? fmtBRL(cost) : '—'
      ]);
    });

    doc.autoTable({
      startY: 31,
      head: [['Peça', 'Categoria', 'Marca / Modelo', 'Atual', 'Mín.', 'Status', 'Comprar', 'Custo repor']],
      body: rows,
      styles: { fontSize: 8, cellPadding: 2.6, textColor: [40,40,40] },
      headStyles: { fillColor: [196, 131, 78], textColor: 255, fontStyle: 'bold', fontSize: 8.3 },
      alternateRowStyles: { fillColor: [246, 244, 240] },
      columnStyles: {
        0: { cellWidth: 30 },
        2: { cellWidth: 32 },
        3: { halign: 'center' },
        4: { halign: 'center' },
        5: { halign: 'center', fontStyle: 'bold' },
        6: { halign: 'center' },
        7: { halign: 'right' }
      },
      didParseCell: function(data){
        if(data.section === 'body' && data.column.index === 5){
          var val = data.cell.raw;
          if(val === 'Baixo'){ data.cell.styles.textColor = [193, 68, 62]; }
          else if(val === 'Médio'){ data.cell.styles.textColor = [163, 111, 20]; }
          else { data.cell.styles.textColor = [58, 130, 103]; }
        }
      }
    });

    var finalY = doc.lastAutoTable.finalY + 12;
    doc.setDrawColor(220, 220, 220);
    doc.line(14, finalY - 6, 196, finalY - 6);

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11.5);
    doc.setTextColor(30, 30, 30);
    doc.text('Total estimado para repor: ' + fmtBRL(totalCost), 14, finalY);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(110, 110, 110);
    doc.text(sorted.length + ' peça(s) no relatório · ' + lowCount + ' baixo(s) · ' + mediumCount + ' médio(s) · ' + goodCount + ' bom(ns) · ' + totalUnits + ' unidade(s) sugeridas', 14, finalY + 7);

    var brandSlug = brandFilter !== "all" ? '-' + brandFilter.toLowerCase().replace(/[^a-z0-9]+/g, '') : '';
    doc.save('relatorio-estoque' + brandSlug + '-' + now.toISOString().slice(0,10) + '.pdf');
    showToast("Relatório PDF gerado.");
  }

  // ---------- detail ----------
  function openDetail(id){
    state.editingId = id;
    state.view = "detail";
    render();
  }

  function renderDetail(){
    var item = state.items.find(function(i){ return i.id === state.editingId; });
    if(!item){ showView("list"); return; }
    var low = isLow(item);
    var tier = stockTier(item);
    var tierColor = tier === 'low' ? 'var(--danger-bright)' : (tier === 'medium' ? 'var(--warning)' : 'var(--solder-bright)');
    var tierLabel = tier === 'low' ? '⚠ Abaixo do estoque mínimo (' + item.minStock + ')' : (tier === 'medium' ? 'Estoque médio · mínimo: ' + item.minStock : 'Estoque bom · mínimo: ' + item.minStock);
    var margin = item.salePrice - item.costPrice;

    var html = '';
    html += '<button class="form-back" id="detail-back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>Voltar</button>';
    html += '<div class="detail-header">' +
      '<div class="detail-icon">' + catIcon(item.category) + '</div>' +
      '<div><h2>' + esc(item.name) + '</h2><p class="sub">' + esc(item.brand) + (item.model ? ' · ' + esc(item.model) : '') + ' · ' + esc(item.category) + '</p></div>' +
    '</div>';

    html += '<div class="detail-stats">' +
      '<div class="detail-stat"><p class="label">Custo (un.)</p><p class="value">' + fmtBRL(item.costPrice) + '</p></div>' +
      '<div class="detail-stat"><p class="label">Venda (un.)</p><p class="value" style="color:var(--copper-bright)">' + fmtBRL(item.salePrice) + '</p></div>' +
      '<div class="detail-stat"><p class="label">Margem por unidade</p><p class="value" style="color:' + (margin>=0?'var(--solder-bright)':'var(--danger-bright)') + '">' + fmtBRL(margin) + '</p></div>' +
      '<div class="detail-stat"><p class="label">Total investido</p><p class="value">' + fmtBRL(item.costPrice*item.quantity) + '</p></div>' +
    '</div>';

    html += '<div class="detail-qty-box">' +
      '<p class="label" style="color:var(--text-muted);font-size:11px;">' + tierLabel + '</p>' +
      '<p class="qty-big" style="color:' + tierColor + '">' + item.quantity + '<span style="font-size:14px;color:var(--text-muted);font-weight:500;"> un.</span></p>' +
      '<div class="detail-qty-controls">' +
        '<button class="qty-btn-lg" id="detail-dec">−</button>' +
        '<button class="qty-btn-lg" id="detail-inc">+</button>' +
      '</div>' +
    '</div>';

    if(item.supplier){
      html += '<div class="detail-notes"><strong style="color:var(--text)">Fornecedor:</strong> ' + esc(item.supplier) + '</div>';
    }
    if(item.notes){
      html += '<div class="detail-notes">' + esc(item.notes) + '</div>';
    }

    html += '<button class="btn-primary" id="detail-edit">Editar peça</button>';
    html += '<button class="btn-danger-outline" id="detail-delete">Excluir peça</button>';

    mainEl.innerHTML = html;

    document.getElementById("detail-back").addEventListener("click", function(){ showView("list"); });
    document.getElementById("detail-inc").addEventListener("click", function(){ adjustQty(item.id, 1); renderDetail(); });
    document.getElementById("detail-dec").addEventListener("click", function(){ adjustQty(item.id, -1); renderDetail(); });
    document.getElementById("detail-edit").addEventListener("click", function(){ state.view = "form"; render(); });
    document.getElementById("detail-delete").addEventListener("click", function(){ askDelete(item.id, item.name); });
  }

  // ---------- delete confirm ----------
  function askDelete(id, name){
    state.pendingDeleteId = id;
    document.getElementById("confirm-text").textContent = '"' + name + '" será removida do estoque permanentemente.';
    document.getElementById("confirm-overlay").classList.remove("hidden");
  }
  document.getElementById("confirm-cancel-btn").addEventListener("click", function(){
    state.pendingDeleteId = null;
    document.getElementById("confirm-overlay").classList.add("hidden");
  });
  document.getElementById("confirm-delete-btn").addEventListener("click", function(){
    if(state.pendingDeleteId){
      state.items = state.items.filter(function(i){ return i.id !== state.pendingDeleteId; });
      saveItems();
      showToast("Peça excluída.");
    }
    state.pendingDeleteId = null;
    document.getElementById("confirm-overlay").classList.add("hidden");
    showView("list");
  });

  document.getElementById("report-cancel-btn").addEventListener("click", function(){
    document.getElementById("report-overlay").classList.add("hidden");
  });
  document.getElementById("report-generate-btn").addEventListener("click", function(){
    document.getElementById("report-overlay").classList.add("hidden");
    generateRestockPDF(state.reportFilterBrand);
  });

  // ---------- form (add/edit) ----------
  function renderForm(){
    var editing = state.editingId ? state.items.find(function(i){ return i.id === state.editingId; }) : null;
    var d = editing || { name:"", category:CATEGORIES[0], brand:BRANDS[0], brandCustom:"", model:"", costPrice:"", salePrice:"", quantity:"", minStock:2, supplier:"", notes:"" };
    var brandIsCustom = editing && BRANDS.indexOf(editing.brand) === -1;

    var html = '';
    html += '<button class="form-back" id="form-back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>Voltar</button>';
    html += '<h2 class="form-title">' + (editing ? 'Editar peça' : 'Nova peça') + '</h2>';

    html += '<div class="form-group"><label>Nome da peça *</label><input type="text" id="f-name" placeholder="Ex: Tela Incell, Bateria original..." value="' + esc(d.name) + '"></div>';

    html += '<div class="form-row">';
    html += '<div class="form-group"><label>Categoria *</label><select id="f-category">' + CATEGORIES.map(function(c){ return '<option value="'+esc(c)+'"'+(d.category===c?' selected':'')+'>'+esc(c)+'</option>'; }).join('') + '</select></div>';
    html += '<div class="form-group"><label>Marca *</label><select id="f-brand">' + BRANDS.map(function(b){ var sel = (brandIsCustom ? b==="Outro" : d.brand===b); return '<option value="'+esc(b)+'"'+(sel?' selected':'')+'>'+esc(b)+'</option>'; }).join('') + '</select></div>';
    html += '</div>';

    html += '<div class="form-group" id="brand-custom-wrap" style="display:' + (brandIsCustom ? 'block' : 'none') + '"><label>Nome da marca</label><input type="text" id="f-brand-custom" placeholder="Digite a marca" value="' + esc(brandIsCustom ? d.brand : "") + '"></div>';

    html += '<div class="form-group"><label>Modelo compatível</label><input type="text" id="f-model" placeholder="Ex: Galaxy A32, iPhone 11..." value="' + esc(d.model) + '"></div>';

    html += '<div class="form-row">';
    html += '<div class="form-group"><label>Preço de custo (R$) *</label><input type="number" id="f-cost" inputmode="decimal" step="0.01" min="0" placeholder="0,00" value="' + esc(d.costPrice) + '"></div>';
    html += '<div class="form-group"><label>Preço de venda (R$) *</label><input type="number" id="f-sale" inputmode="decimal" step="0.01" min="0" placeholder="0,00" value="' + esc(d.salePrice) + '"></div>';
    html += '</div>';

    html += '<div class="form-row">';
    html += '<div class="form-group"><label>Quantidade em estoque *</label><input type="number" id="f-qty" inputmode="numeric" min="0" step="1" placeholder="0" value="' + esc(d.quantity) + '"></div>';
    html += '<div class="form-group"><label>Estoque mínimo *</label><input type="number" id="f-min" inputmode="numeric" min="0" step="1" placeholder="2" value="' + esc(d.minStock) + '"></div>';
    html += '</div>';

    html += '<div class="form-group"><label>Fornecedor</label><input type="text" id="f-supplier" placeholder="Opcional" value="' + esc(d.supplier) + '"></div>';
    html += '<div class="form-group"><label>Observações</label><textarea id="f-notes" placeholder="Opcional">' + esc(d.notes) + '</textarea></div>';

    html += '<div id="form-error" class="field-error" style="display:none"></div>';
    html += '<button class="btn-primary" id="form-save">' + (editing ? 'Salvar alterações' : 'Adicionar ao estoque') + '</button>';

    mainEl.innerHTML = html;

    document.getElementById("form-back").addEventListener("click", function(){
      showView(editing ? "detail" : "list");
    });

    document.getElementById("f-brand").addEventListener("change", function(){
      var wrap = document.getElementById("brand-custom-wrap");
      wrap.style.display = this.value === "Outro" ? "block" : "none";
    });

    document.getElementById("form-save").addEventListener("click", function(){
      submitForm(editing);
    });
  }

  function submitForm(editing){
    var name = document.getElementById("f-name").value.trim();
    var category = document.getElementById("f-category").value;
    var brandSel = document.getElementById("f-brand").value;
    var brandCustom = document.getElementById("f-brand-custom").value.trim();
    var brand = brandSel === "Outro" && brandCustom ? brandCustom : brandSel;
    var model = document.getElementById("f-model").value.trim();
    var costPrice = parseFloat(document.getElementById("f-cost").value);
    var salePrice = parseFloat(document.getElementById("f-sale").value);
    var quantity = parseInt(document.getElementById("f-qty").value, 10);
    var minStock = parseInt(document.getElementById("f-min").value, 10);
    var supplier = document.getElementById("f-supplier").value.trim();
    var notes = document.getElementById("f-notes").value.trim();

    var errEl = document.getElementById("form-error");
    if(!name){ return showFormError("Digite o nome da peça."); }
    if(brandSel === "Outro" && !brandCustom){ return showFormError("Digite o nome da marca."); }
    if(isNaN(costPrice) || costPrice < 0){ return showFormError("Informe um preço de custo válido."); }
    if(isNaN(salePrice) || salePrice < 0){ return showFormError("Informe um preço de venda válido."); }
    if(isNaN(quantity) || quantity < 0){ return showFormError("Informe uma quantidade válida."); }
    if(isNaN(minStock) || minStock < 0){ minStock = 0; }

    if(editing){
      editing.name = name; editing.category = category; editing.brand = brand; editing.model = model;
      editing.costPrice = costPrice; editing.salePrice = salePrice; editing.quantity = quantity; editing.minStock = minStock;
      editing.supplier = supplier; editing.notes = notes; editing.updatedAt = new Date().toISOString();
      saveItems();
      showToast("Peça atualizada.");
      state.editingId = editing.id;
      state.view = "detail";
      render();
    } else {
      var newItem = {
        id: uid(), name: name, category: category, brand: brand, model: model,
        costPrice: costPrice, salePrice: salePrice, quantity: quantity, minStock: minStock,
        supplier: supplier, notes: notes, updatedAt: new Date().toISOString()
      };
      state.items.push(newItem);
      saveItems();
      showToast("Peça adicionada ao estoque.");
      showView("list");
    }

    function showFormError(msg){
      errEl.textContent = msg;
      errEl.style.display = "block";
    }
  }

  // ---------- navigation ----------
  function showView(view){
    state.view = view;
    if(view !== "form") { /* keep editingId only for detail/form flows */ }
    if(view === "list" || view === "dashboard") state.editingId = null;
    render();
  }

  navEl.querySelectorAll(".nav-btn").forEach(function(btn){
    btn.addEventListener("click", function(){ showView(btn.getAttribute("data-view")); });
  });
  document.getElementById("fab-add").addEventListener("click", function(){
    state.editingId = null;
    state.view = "form";
    render();
  });

  // ---------- init ----------
  loadItems().then(function(items){
    state.items = items;
    state.loading = false;
    render();
  });

})();
</script>
</body>
</html>
